# Patch for vpc-u: peering with the default VPC on a second link, and the routes towards the default subnet.
# The merge REPLACES the arrays vpcPeerings and staticRoutes.
# CHANGE: 169.254.1.1/30 is the local end (the other end, 169.254.1.2, is in 57-...); each peering needs its own /30.
spec:
  vpcPeerings:
  - remoteVpc: ovn-cluster
    localConnectIP: 169.254.1.1/30
  staticRoutes:
  - cidr: 10.16.0.0/16
    nextHopIP: 169.254.1.2
    policy: policyDst
