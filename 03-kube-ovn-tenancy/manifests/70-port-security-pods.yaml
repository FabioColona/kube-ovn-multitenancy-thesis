# Pods for 40-port-security.sh, in their own namespace on the default subnet (ovn-default).
#   ps-dst : server (ping and TCP 8080) that the other two pods try to reach
#   ps-off : holds NET_ADMIN, NO port_security annotation
#   ps-on  : holds NET_ADMIN, annotation ovn.kubernetes.io/port_security: "true"
# NET_ADMIN lets the test add an address that Kube-OVN did not assign (the "spoofed" source address).
# CHANGE: the namespace name must match NS_PS in config.env. The image needs ping, ip and an httpd applet (busybox does).
apiVersion: v1
kind: Namespace
metadata:
  name: ns-ps
---
apiVersion: v1
kind: Pod
metadata: {name: ps-dst, namespace: ns-ps}
spec:
  containers:
  - name: c
    image: "docker.io/library/busybox:1.36"
    command: ["sh", "-c", "exec httpd -f -p 8080 -h /tmp"]
---
apiVersion: v1
kind: Pod
metadata: {name: ps-off, namespace: ns-ps}
spec:
  containers:
  - name: c
    image: "docker.io/library/busybox:1.36"
    command: ["sleep", "86400"]
    securityContext:
      capabilities: {add: ["NET_ADMIN"]}
---
apiVersion: v1
kind: Pod
metadata:
  name: ps-on
  namespace: ns-ps
  annotations:
    ovn.kubernetes.io/port_security: "true"
spec:
  containers:
  - name: c
    image: "docker.io/library/busybox:1.36"
    command: ["sleep", "86400"]
    securityContext:
      capabilities: {add: ["NET_ADMIN"]}
