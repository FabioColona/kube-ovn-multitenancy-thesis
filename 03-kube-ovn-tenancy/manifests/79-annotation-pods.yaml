# Pods of 23-admission-annotations.sh, selected with the label "case". Each is created in ns-an.
#   free     : both annotations, used without the policy (the tenant removes them afterwards)
#   legit    : both annotations as the policy requires
#   noanno   : no annotations
#   nops     : security group but no port_security
#   othersg  : port_security but another security group
apiVersion: v1
kind: Pod
metadata:
  name: an-free
  namespace: ns-an
  labels: {case: free}
  annotations: {ovn.kubernetes.io/port_security: "true", ovn.kubernetes.io/security_groups: "sg-an"}
spec:
  containers: [{name: c, image: "docker.io/library/busybox:1.36", command: ["sleep", "86400"]}]
---
apiVersion: v1
kind: Pod
metadata:
  name: an-legit
  namespace: ns-an
  labels: {case: legit}
  annotations: {ovn.kubernetes.io/port_security: "true", ovn.kubernetes.io/security_groups: "sg-an"}
spec:
  containers: [{name: c, image: "docker.io/library/busybox:1.36", command: ["sleep", "86400"]}]
---
