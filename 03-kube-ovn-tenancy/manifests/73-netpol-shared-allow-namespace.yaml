# NetworkPolicy used by 41-netpol-vpc.sh (part 1): allow ingress to ns-shared from the namespaces that carry the label
# netpol-test=allowed. The script puts the label on ns-vt (namespace of the custom VPC) and takes it away again.
# CHANGE: the label must match NP_LABEL in config.env; the namespace must match NS_SHARED.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-labelled-namespaces, namespace: ns-shared}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {netpol-test: allowed}
