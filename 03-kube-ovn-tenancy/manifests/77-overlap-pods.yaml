spec:
  containers:
  - name: c
    image: "docker.io/library/busybox:1.36"
    command: ["sh", "-c", "sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: o3-srv
  namespace: ns-o3
  annotations:
    ovn.kubernetes.io/ip_address: 10.80.0.10
spec:
  containers:
