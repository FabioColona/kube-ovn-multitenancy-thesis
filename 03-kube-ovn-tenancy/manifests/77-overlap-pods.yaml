---
apiVersion: v1
kind: Pod
metadata:
  name: t-dup
  namespace: ns-t
  annotations:
    ovn.kubernetes.io/ip_address: 10.80.0.10
spec:
  containers:
  - name: c
    image: "docker.io/library/busybox:1.36"
    command: ["sh", "-c", "mkdir -p /www && echo T > /www/who && exec httpd -f -p 8080 -h /www"]
