# NetworkPolicy used by 41-netpol-vpc.sh (part 1): allow ingress to ns-shared from the CIDR of the custom VPC subnet.
# It works because the peering keeps the real source address (no NAT between the VPCs).
# CHANGE: the cidr must be the CIDR of sub-vt (50-custom-vpcs.yaml); the namespace must match NS_SHARED.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-vpc-t-cidr, namespace: ns-shared}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - ipBlock: {cidr: 10.90.0.0/24}
