# Patch for vpc-t: adds ONE route, towards the subnet of the other tenant, through ovn-cluster.
# The merge replaces the array, so the routes of 52-... are repeated.
# CHANGE: 10.91.0.0/24 is the CIDR of sub-vu.
spec:
  staticRoutes:
  - cidr: 10.16.0.0/16
    nextHopIP: 169.254.0.2
    policy: policyDst
  - cidr: 10.80.0.0/24
    nextHopIP: 169.254.0.2
    policy: policyDst
  - cidr: 10.91.0.0/24
    nextHopIP: 169.254.0.2
    policy: policyDst
