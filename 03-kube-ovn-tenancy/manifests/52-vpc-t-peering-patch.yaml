# Patch for vpc-t (kubectl patch vpc vpc-t --type merge --patch-file this-file): peering with the default VPC
# and the routes towards it. The merge REPLACES the arrays vpcPeerings and staticRoutes.
# CHANGE: 169.254.0.1/30 is the local end of the link (the other end, 169.254.0.2, is in 53-...);
#         10.16.0.0/16 is the pod CIDR (ovn-default); 10.80.0.0/24 is the private subnet sub-t.
spec:
  vpcPeerings:
  - remoteVpc: ovn-cluster
    localConnectIP: 169.254.0.1/30
  staticRoutes:
  - cidr: 10.16.0.0/16
    nextHopIP: 169.254.0.2
    policy: policyDst
  - cidr: 10.80.0.0/24
    nextHopIP: 169.254.0.2
    policy: policyDst
