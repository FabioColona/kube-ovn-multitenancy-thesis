# Patch for vpc-t (site A): peering with the default VPC and the routes of the BASELINE (the merge REPLACES the arrays).
# The routes towards the other site (10.17.0.0/16, 10.81.0.0/24, 10.60.0.0/24) go through ovn-cluster, which learns them from OVN-IC.
# CHANGE: 169.254.0.1/30 is the local end of the link (the other end, 169.254.0.2, is in 44-...); the CIDRs are those of
#         manifests/40-* and 41-*. Each peering needs its own /30.
spec:
  vpcPeerings:
  - remoteVpc: ovn-cluster
    localConnectIP: 169.254.0.1/30
  staticRoutes:
  - {cidr: 10.16.0.0/16, nextHopIP: 169.254.0.2, policy: policyDst}
  - {cidr: 10.80.0.0/24, nextHopIP: 169.254.0.2, policy: policyDst}
  - {cidr: 10.17.0.0/16, nextHopIP: 169.254.0.2, policy: policyDst}
  - {cidr: 10.81.0.0/24, nextHopIP: 169.254.0.2, policy: policyDst}
  - {cidr: 10.60.0.0/24, nextHopIP: 169.254.0.2, policy: policyDst}
