# Pods of site A for 30-netpol-cross-site.sh.
#   srv       : target (ping and TCP 8080); the policies select it with run=srv
#   ctl-label : local control client, carries app=client (the label the podSelector rule asks for)
#   ctl-ns    : local control client in another namespace labelled np=allowed (what the namespaceSelector rule asks for)
# CHANGE: the namespaces must match NS_NP and NS_NP_LOCAL in config.env; the image must have ping, nc and httpd (busybox does).
apiVersion: v1
kind: Namespace
metadata: {name: ic-np}
---
apiVersion: v1
kind: Namespace
metadata: {name: ic-np-local, labels: {np: allowed}}
---
apiVersion: v1
kind: Pod
metadata: {name: srv, namespace: ic-np, labels: {run: srv}}
spec:
  containers:
  - name: c
    image: docker.io/library/busybox:1.36
    command: ["sh", "-c", "exec httpd -f -p 8080 -h /tmp"]
---
apiVersion: v1
kind: Pod
metadata: {name: ctl-label, namespace: ic-np, labels: {app: client}}
spec:
  containers:
  - name: c
    image: docker.io/library/busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: ctl-ns, namespace: ic-np-local}
spec:
  containers:
  - name: c
    image: docker.io/library/busybox:1.36
    command: ["sleep", "3600"]
