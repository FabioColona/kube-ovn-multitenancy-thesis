# 43-ic-overlap.sh, scenario 2, site A: the pod that legitimately owns 10.16.5.10 in the default subnet and answers SITE-A.
# CHANGE: the address must be the one of the pod att in 58-...
apiVersion: v1
kind: Pod
metadata:
  name: vic
  namespace: ns-d
  annotations: {ovn.kubernetes.io/ip_address: 10.16.5.10}
spec:
  containers:
  - name: c
    image: docker.io/library/busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo SITE-A > /www/who && exec httpd -f -p 8080 -h /www"]
