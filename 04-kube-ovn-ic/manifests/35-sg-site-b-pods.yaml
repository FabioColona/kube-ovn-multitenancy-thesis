# Pods of site B for 31-sg-cross-site.sh. Apply AFTER the SecurityGroup (34-sg-b-members.yaml).
#   cli-sg   : remote client in the group sg-ic of site B (same name as the group of the target)
#   cli-nosg : remote client with no group
# CHANGE: the namespace must match NS_SG and the group name SG_NAME in config.env.
apiVersion: v1
kind: Namespace
metadata: {name: ic-sg}
---
apiVersion: v1
kind: Pod
metadata:
  name: cli-sg
  namespace: ic-sg
  annotations: {ovn.kubernetes.io/port_security: "true", ovn.kubernetes.io/security_groups: sg-ic}
spec:
  containers:
  - name: c
    image: docker.io/library/busybox:1.36
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata: {name: cli-nosg, namespace: ic-sg}
spec:
  containers:
  - name: c
    image: docker.io/library/busybox:1.36
    command: ["sleep", "3600"]
