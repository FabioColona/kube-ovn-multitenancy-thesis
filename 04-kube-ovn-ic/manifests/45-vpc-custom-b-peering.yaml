# Patch for vpc-custom-b (site B): peering with the default VPC of site B and the routes of the BASELINE: the whole pod
# CIDR of both sites and the custom subnet of tenant T on site A. No route to the private subnets of site A (10.80.0.0/24,
# 10.82.0.0/24): the tests 41 add them one at a time.
# CHANGE: 169.254.2.1/30 is the local end (the other end, 169.254.2.2, is in 46-...).
spec:
  vpcPeerings:
  - remoteVpc: ovn-cluster
    localConnectIP: 169.254.2.1/30
  staticRoutes:
  - {cidr: 10.17.0.0/16, nextHopIP: 169.254.2.2, policy: policyDst}
  - {cidr: 10.16.0.0/16, nextHopIP: 169.254.2.2, policy: policyDst}
  - {cidr: 10.90.0.0/24, nextHopIP: 169.254.2.2, policy: policyDst}
