# Pods of site A for 31-sg-cross-site.sh. Apply AFTER the SecurityGroup (31-sg-a-members.yaml): a pod whose group
# does not exist yet is not created correctly.
#   srv      : target (ping and TCP 8080), in the group sg-ic
#   local-sg : local control client, in the same group
# CHANGE: the namespace must match NS_SG and the group name SG_NAME in config.env; the image needs ping, nc and httpd.
apiVersion: v1
kind: Namespace
metadata: {name: ic-sg}
---
apiVersion: v1
kind: Pod
metadata:
  name: srv
  namespace: ic-sg
  annotations: {ovn.kubernetes.io/port_security: "true", ovn.kubernetes.io/security_groups: sg-ic}
spec:
  containers:
  - name: c
    image: docker.io/library/busybox:1.36
    command: ["sh", "-c", "exec httpd -f -p 8080 -h /tmp"]
---
apiVersion: v1
kind: Pod
metadata:
  name: local-sg
  namespace: ic-sg
  annotations: {ovn.kubernetes.io/port_security: "true", ovn.kubernetes.io/security_groups: sg-ic}
spec:
  containers:
  - name: c
    image: docker.io/library/busybox:1.36
    command: ["sleep", "3600"]
